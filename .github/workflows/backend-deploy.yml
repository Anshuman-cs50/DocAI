name: Backend CD — Deploy to Render

on:
  # This makes the deploy trigger ONLY when the CI workflow completes.
  workflow_run:
    workflows: ["Backend CI — Lint & Test"]
    types:
      - completed
    branches:
      - main
      - dev

  # Allow triggering manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    # Only run the deploy if the CI actually succeeded (or if triggered manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Render (${{ github.event.workflow_run.head_branch == 'main' && 'Production' || 'Development' }})
    runs-on: ubuntu-latest
    
    # Map the branch to the correct GitHub Environment so it pulls the correct RENDER_SERVICE_ID
    environment:
      name: ${{ (github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main') && 'production' || 'development' }}

    steps:
      - name: Trigger and Wait for Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "[ERROR] Missing RENDER_API_KEY or RENDER_SERVICE_ID secret. Please configure them in GitHub."
            exit 1
          fi

          echo "Triggering Render deployment for service $RENDER_SERVICE_ID..."
          
          # Trigger deploy via Render API
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          # Extract deploy ID using jq
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')
          
          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "[ERROR] Failed to trigger deployment. API Response: $RESPONSE"
            exit 1
          fi
          
          echo "Deployment triggered successfully! Deploy ID: $DEPLOY_ID"
          echo "Waiting for deployment to complete..."
          
          # Poll status
          while true; do
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
              
            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')
            
            if [ "$STATUS" == "live" ]; then
              echo "[SUCCESS] Deployment is live on Render!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "update_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "[ERROR] Deployment failed with status: $STATUS"
              exit 1
            fi
            
            echo "Current status: $STATUS. Checking again in 15 seconds..."
            sleep 15
          done
