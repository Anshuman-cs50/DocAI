name: Frontend CD — Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

  # Allow triggering manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel (${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        env:
          # Set this in GitHub → Settings → Environments → secrets
          # It should point at your deployed Render backend URL for that env
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Vercel
        # Requires three GitHub secrets:
        #   VERCEL_TOKEN       — from vercel.com → Account → Settings → Tokens
        #   VERCEL_ORG_ID      — from .vercel/project.json (run `vercel link` locally first)
        #   VERCEL_PROJECT_ID  — from .vercel/project.json
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

