name: Backend CD — Deploy to Dev

on:
  workflow_run:
    workflows: ["Backend CI — Lint & Test"]
    types:
      - completed
    branches:
      - dev  # Only triggers when CI ran on the dev branch

  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Render (Development)
    runs-on: ubuntu-latest

    # Only deploy if CI succeeded on a push (not a PR sync), or if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Trigger Render Deployment (Dev)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_DEV }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "[ERROR] Missing RENDER_API_KEY or RENDER_SERVICE_ID_DEV repository secret."
            exit 1
          fi

          echo "Triggering Render deployment for DEV service: $RENDER_SERVICE_ID..."

          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "[ERROR] Failed to trigger deployment. API Response: $RESPONSE"
            exit 1
          fi

          echo "[SUCCESS] Dev deployment triggered! Deploy ID: $DEPLOY_ID"
          echo "Waiting for Render to finish deploying..."

          # Poll until Render finishes (live, failed, or canceled)
          MAX_WAIT=1200  # 20 minutes timeout
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')

            if [ "$STATUS" == "live" ]; then
              echo "[SUCCESS] Dev deployment is live on Render!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "update_failed" ] || [ "$STATUS" == "pre_deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "[ERROR] Dev deployment failed with status: $STATUS"
              exit 1
            fi

            echo "Current status: $STATUS. Checking again in 15 seconds... (${ELAPSED}s elapsed)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "[ERROR] Timed out after ${MAX_WAIT}s waiting for deployment to complete. Last status: $STATUS"
          exit 1
