name: Backend CD — Deploy to Dev

on:
  workflow_run:
    workflows: ["Backend CI — Lint & Test"]
    types:
      - completed
    branches:
      - dev  # Only triggers when CI ran on the dev branch

  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Render (Development)
    runs-on: ubuntu-latest

    # Only deploy if CI succeeded on a push (not a PR sync), or if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Trigger Render Deployment (Dev)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_DEV }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "[ERROR] Missing RENDER_API_KEY or RENDER_SERVICE_ID_DEV repository secret."
            exit 1
          fi

          echo "Triggering Render deployment for DEV service..."

          # Step 1: Fire the deploy trigger. We do NOT rely on this response body
          # because Render may return empty on HTTP/2 connections from GitHub runners.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json")

          echo "Render API responded with HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "[ERROR] Render API rejected the deploy trigger (HTTP $HTTP_STATUS)."
            exit 1
          fi

          echo "[SUCCESS] Deploy trigger accepted by Render."
          echo "Waiting 10 seconds for the deploy to be registered..."
          sleep 10

          # Step 2: Fetch the latest deploy ID from the deploy list (independent of trigger response)
          DEPLOYS_RESPONSE=$(curl -s -X GET \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          echo "Deploy list response: $DEPLOYS_RESPONSE"

          DEPLOY_ID=$(echo "$DEPLOYS_RESPONSE" | jq -r '.[0].deploy.id // .[0].id // empty')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "[ERROR] Could not retrieve latest deploy ID from Render. Response: $DEPLOYS_RESPONSE"
            exit 1
          fi

          echo "Tracking deploy: $DEPLOY_ID"

          # Step 3: Poll until Render finishes
          MAX_WAIT=1200  # 20 minutes timeout
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS_RESPONSE=$(curl -s -X GET \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.deploy.status // .status // empty')

            if [ "$STATUS" == "live" ]; then
              echo "[SUCCESS] Dev deployment is live on Render!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "update_failed" ] || [ "$STATUS" == "pre_deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "[ERROR] Dev deployment failed with status: $STATUS"
              exit 1
            fi

            echo "Current status: $STATUS. Checking again in 15 seconds... (${ELAPSED}s elapsed)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "[ERROR] Timed out after ${MAX_WAIT}s waiting for deployment. Last status: $STATUS"
          exit 1
