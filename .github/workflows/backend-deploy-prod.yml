name: Backend CD — Deploy to Prod

on:
  workflow_run:
    workflows: ["Backend CI — Lint & Test"]
    types:
      - completed
    branches:
      - main  # Only triggers when CI ran on the main branch

  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest

    # Only deploy if CI succeeded on a push (not a PR sync), or if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Trigger Render Deployment (Prod)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "[ERROR] Missing RENDER_API_KEY or RENDER_SERVICE_ID_PROD repository secret."
            exit 1
          fi

          echo "Triggering Render deployment for PROD service: $RENDER_SERVICE_ID..."

          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "[ERROR] Failed to trigger deployment. API Response: $RESPONSE"
            exit 1
          fi

          echo "[SUCCESS] Prod deployment triggered! Deploy ID: $DEPLOY_ID"
          echo "Waiting for Render to finish deploying..."

          # Poll until Render finishes (live, failed, or canceled)
          while true; do
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')

            if [ "$STATUS" == "live" ]; then
              echo "[SUCCESS] Prod deployment is live on Render!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "update_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "[ERROR] Prod deployment failed with status: $STATUS"
              exit 1
            fi

            echo "Current status: $STATUS. Checking again in 15 seconds..."
            sleep 15
          done
